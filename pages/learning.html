<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnGame Lesson Player | A1 English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/player.css" />
</head>
<body class="player-body">
  <div class="player-app" id="playerApp">
    <!-- Top Header: EnGame Logo & Branding, XP Points, Level Indicator, Dark Mode & Fullscreen -->
    <header class="player-header">
      <div class="player-header-left">
        <a href="../index.html" class="brand-link" title="Back to EnGame Lessons">
          <div class="brand-logo engame-logo small" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="2" y="5" width="20" height="14" rx="7" fill="#B8FF4A"/>
              <path d="M7.5 10v4M5.5 12h4" stroke="#126E62" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="15.5" cy="11" r="1.3" fill="#126E62"/>
              <circle cx="18" cy="13" r="1.3" fill="#19A991"/>
            </svg>
          </div>
          <div>
            <div class="brand-row">
              <span class="engame-tag">EnGame</span>
              <h1 class="brand-title">A1 English</h1>
            </div>
            <p class="brand-subtitle">Learn • Practice • Level Up</p>
          </div>
        </a>
        <div class="lesson-badge-header" id="headerLessonBadge">Lesson 01</div>
      </div>

      <div class="player-header-right">
        <div class="gamify-hud player-hud">
          <div class="hud-pill xp-pill" id="playerXpPill" title="Total XP Earned">
            <span class="hud-icon">⚡</span>
            <span id="playerXpText">0 XP</span>
          </div>
          <div class="hud-pill level-pill" id="playerLevelPill" title="Learner Level">
            <span class="hud-icon">🏅</span>
            <span id="playerLevelText">Lvl 1 • A1</span>
          </div>
        </div>

        <button class="icon-btn mobile-sidebar-btn" id="toggleSidebarBtn" aria-label="Toggle Slides List" title="Lesson Slides">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span class="btn-label-sm">Slides</span>
        </button>

        <button class="icon-btn" id="themeToggle" aria-label="Toggle Dark Mode" title="Toggle Dark Mode">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
        </button>

        <button class="icon-btn" id="fullscreenBtn" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="app-notice hidden" id="appNotice" role="status" aria-live="polite"></div>

    <!-- Workspace: Main Slide Stage + Right Sidebar -->
    <div class="player-workspace">
      <main class="slide-stage" id="slideStage">
        <div class="slide-viewport" id="slideViewport">
          <div class="slide-canvas" id="slideCanvas">
            <!-- Dynamic Slide Content Rendered Here -->
          </div>
        </div>
        <!-- XP / Achievement Toast Notification -->
        <div class="xp-toast hidden" id="xpToast">+10 XP Earned! ⚡</div>
      </main>

      <aside class="slides-sidebar" id="slidesSidebar" aria-label="Lesson Slides">
        <div class="sidebar-header">
          <div>
            <span class="sidebar-kicker" id="sidebarLessonCode">LESSON 01</span>
            <h2 class="sidebar-title" id="sidebarLessonTitle">Greetings &amp; Introductions</h2>
          </div>
          <button class="icon-btn close-sidebar-mobile" id="closeSidebarBtn" aria-label="Close Slides List">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="sidebar-lesson-switcher">
          <label for="lessonSelect" class="sr-only">Switch Lesson</label>
          <select id="lessonSelect" class="lesson-select"></select>
        </div>

        <ul class="slides-list" id="slidesList">
          <!-- Slide items populated dynamically -->
        </ul>
      </aside>
    </div>

    <!-- Bottom Controls: Previous, Next Slide, Progress Bar, Slide Counter, Zoom Controls -->
    <footer class="player-controls">
      <div class="controls-left">
        <button class="nav-btn btn-secondary" id="prevSlideBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Previous</span>
        </button>
      </div>

      <div class="controls-center">
        <div class="progress-meta">
          <span id="slideCounterText">Slide 1 / 7</span>
          <span id="progressPercentText">14%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressTrack">
          <div class="progress-fill" id="progressFill" style="width: 14%"></div>
        </div>
      </div>

      <div class="controls-right">
        <div class="zoom-controls" aria-label="Zoom Controls">
          <button class="zoom-btn" id="zoomOutBtn" title="Zoom Out" aria-label="Zoom Out">−</button>
          <span class="zoom-label" id="zoomLevelText">100%</span>
          <button class="zoom-btn" id="zoomInBtn" title="Zoom In" aria-label="Zoom In">+</button>
          <button class="zoom-btn zoom-reset" id="zoomResetBtn" title="Reset Zoom" aria-label="Reset Zoom">Reset</button>
        </div>

        <button class="nav-btn btn-primary" id="nextSlideBtn">
          <span id="nextSlideBtnText">Next Slide</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Mistake Review Modal -->
  <div class="modal-backdrop hidden" id="reviewModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Review Your Mistakes</h3>
        <button class="icon-btn" id="closeReviewModal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="reviewModalBody"></div>
    </div>
  </div>

  <script src="../assets/js/lessons.js"></script>
  <script src="../assets/js/slides.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/progress.js"></script>
  <script src="../assets/js/integration.js"></script>
  <script src="../assets/js/activities.js"></script>
  <script src="../assets/js/player.js"></script>
</body>
</html>
