<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnGame • A1 English Lessons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/lessons.css" />
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-logo engame-logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="5" width="20" height="14" rx="7" fill="#B8FF4A"/>
            <path d="M7.5 10v4M5.5 12h4" stroke="#126E62" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="15.5" cy="11" r="1.3" fill="#126E62"/>
            <circle cx="18" cy="13" r="1.3" fill="#19A991"/>
          </svg>
        </div>
        <div>
          <div class="brand-row">
            <span class="engame-tag">EnGame</span>
            <h1 class="brand-title">A1 English Lessons</h1>
          </div>
          <p class="brand-subtitle">Learn • Practice • Level Up</p>
        </div>
      </div>

      <div class="top-actions">
        <div class="gamify-hud" aria-label="Player Progress">
          <div class="hud-pill xp-pill" title="Earned Experience Points">
            <span class="hud-icon">⚡</span>
            <span id="headerXpText">0 XP</span>
          </div>
          <div class="hud-pill level-pill" title="Current Learner Level">
            <span class="hud-icon">🏅</span>
            <span id="headerLevelText">Lvl 1 • A1</span>
          </div>
          <div class="overall-pill" id="overallProgressPill" title="Completed Lessons">
            <span class="dot"></span>
            <span id="overallProgressText">0 / 5 Done</span>
          </div>
        </div>


      </div>
    </header>

      <div class="app-notice hidden" id="appNotice" role="status" aria-live="polite"></div>

    <main class="lessons-container">
      <section class="intro-banner">
        <div class="intro-banner-text">
          <span class="badge-lime">🎮 EnGame Lessons • CEFR A1</span>
          <h2>Choose Your English Lesson</h2>
          <p>Complete structured A1 slides, practice listening &amp; speaking, earn XP &amp; stars, and unlock achievements.</p>
        </div>
        <div class="banner-stats">
          <div class="stat-chip">
            <strong id="completedCount">0/5</strong>
            <span>Lessons</span>
          </div>
          <div class="stat-chip">
            <strong id="bannerStarsCount">0 ★</strong>
            <span>Stars Earned</span>
          </div>
          <div class="stat-chip lime-chip">
            <strong id="bannerXpCount">0 XP</strong>
            <span>Total XP</span>
          </div>
        </div>
      </section>

      <!-- Subtle Achievements Strip -->
      <section class="achievements-strip" id="achievementsStrip" aria-label="Learner Achievements">
        <!-- Populated dynamically by lessons.js -->
      </section>

      <section class="lessons-grid" id="lessonsGrid" aria-label="A1 English Lessons">
        <!-- Populated dynamically by lessons.js -->
      </section>
    </main>
  </div>

  <script src="assets/js/lessons.js"></script>
  <script src="assets/js/slides.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/progress.js"></script>
  <script src="assets/js/integration.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initThemeToggle();
      initFullscreenToggle();
      renderLessonsGrid();
    });
  </script>
</body>
</html>
